services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://privy:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/privy
      FRONTEND_URL: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["8080:80"]
    depends_on: [backend]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: privy
      POSTGRES_USER: privy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U privy"]
      interval: 5s
      retries: 10
volumes:
  postgres-data:
